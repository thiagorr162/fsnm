[project]
name = "fsnm"
version = "0.1.0"
description = "Functional Spectral-Newton Method"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pandas>=2.3",
    "pyarrow>=21.0",
    "scikit-learn>=1.6",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["fsnm"]
